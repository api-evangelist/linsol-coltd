aid: linsol-coltd
name: LINSOL Co.,Ltd.
description: 'LINSOL Co.,Ltd. (린솔) is a safety-technology company headquartered in Daejeon,
  South Korea, founded as an in-house venture spun out of Hanwha Aerospace. LINSOL adapts
  acoustic detection techniques originally developed for defense landmine applications
  into commercial real-time hazard, accident, and environmental detection. Its product line
  includes Karang F (driving-environment detection), Karang S (precision acoustic signal
  transmission), SkyShield (fall detection), BR, Acoustic Eye (aerial security), and Safety
  Nova (smart integrated safety platform), sold into industrial safety, ESG, and defense
  security use cases. The company operates a Daejeon headquarters and research center plus a
  Goheung branch. LINSOL ships hardware and integrated platforms; as of a 2026-07-19 probe it
  publishes no public developer API, portal, SDK, or machine-readable specification.'
